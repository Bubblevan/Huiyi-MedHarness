[project]
name = "huiyi-health-engine"
version = "0.1.0"
description = "Local Python memory and health-data plane for Huiyi MedHarness"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "requests>=2.32,<3",
  "numpy>=1.26,<3",
  "faiss-cpu>=1.9,<2",
  "tiktoken>=0.8,<1",
  "sentence-transformers>=3.0,<6",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
huiyi-health-engine = "huiyi_health_engine.app:run"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huiyi_health_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

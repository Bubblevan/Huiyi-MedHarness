name: huiyi-edge-demo

services:
  edge-auth:
    build:
      context: ../..
      dockerfile: deploy/edge-demo/Dockerfile.auth
    environment:
      NODE_ENV: production
      PORT: 8081
      HUIYI_GATEWAY_UPSTREAM: ${HUIYI_GATEWAY_UPSTREAM:-http://host.docker.internal:8320}
      HUIYI_PUBLIC_ORIGIN: ${HUIYI_PUBLIC_ORIGIN:-https://localhost:8443}
      HUIYI_PUBLIC_ENVIRONMENT: ${HUIYI_PUBLIC_ENVIRONMENT:-临床评测环境}
      HUIYI_PUBLIC_PROVIDER: ${HUIYI_PUBLIC_PROVIDER:-}
      HUIYI_PUBLIC_MODEL: ${HUIYI_PUBLIC_MODEL:-}
      HUIYI_PUBLIC_VERSION: ${HUIYI_PUBLIC_VERSION:-local}
      HUIYI_PUBLIC_AUDIT_URL: ${HUIYI_PUBLIC_AUDIT_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks: [edge]
    restart: unless-stopped

  edge-web:
    build:
      context: ../..
      dockerfile: deploy/edge-demo/Dockerfile.web
    depends_on:
      edge-auth:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    command: ["caddy", "run", "--config", "${CADDY_CONFIG:-/etc/caddy/Caddyfile}", "--adapter", "caddyfile"]
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTP_PORT:-8080}:80"
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTPS_PORT:-8443}:443"
    read_only: true
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8888/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [edge]
    restart: unless-stopped

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

# Merge these rows into $DSH_HOME/profiles/headless/cordis.patch.yml.
# The values below belong to the deployment profile, not the Huiyi bundle.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-qwen:
        displayName: Local Qwen
        api: openai-completions
        baseURL: http://127.0.0.1:8000/v1
        apiKeyEnv: HUIYI_LOCAL_QWEN_API_KEY
        models:
          - id: Qwen/Qwen3-8B
            name: Local Qwen3-8B
            contextWindow: 32768

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: local-qwen
    model: Qwen/Qwen3-8B
